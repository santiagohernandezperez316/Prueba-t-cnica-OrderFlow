services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-OrderFlow_Dev123!}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    # RabbitMQ guarda sus datos por nombre de nodo; un hostname fijo permite reutilizar el volumen.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orderflow_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  orders-api:
    build:
      context: ./backend
      dockerfile: OrderFlow.Orders.Api/Dockerfile
    # Si la migración inicial falla (SQL Server recién creado puede no responder a tiempo), un proceso nuevo reintenta.
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      ConnectionStrings__OrdersDb: Server=sqlserver,1433;Database=OrdersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-OrderFlow_Dev123!};TrustServerCertificate=True
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-orderflow}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-orderflow_dev}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-worker:
    build:
      context: ./backend
      dockerfile: OrderFlow.Inventory.Worker/Dockerfile
    # Si la migración inicial falla (SQL Server recién creado puede no responder a tiempo), un proceso nuevo reintenta.
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      ConnectionStrings__InventoryDb: Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-OrderFlow_Dev123!};TrustServerCertificate=True
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-orderflow}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-orderflow_dev}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    # nginx sirve la SPA y hace de proxy de /api y /hubs hacia orders-api y de /inventory-api hacia
    # inventory-worker (mismo origen, sin CORS).
    ports:
      - "8082:80"
    # nginx resuelve los nombres de los upstreams al arrancar; esperar a los healthchecks evita que falle el inicio.
    depends_on:
      orders-api:
        condition: service_healthy
      inventory-worker:
        condition: service_healthy

  # Tests sin SDK ni Node locales; el profile evita que docker compose up los levante.
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    # Testcontainers crea su propio SQL Server en el Docker del host (por eso el socket) y lo alcanza
    # por el puerto publicado en el host. host-gateway hace que host.docker.internal exista en Linux.
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  sqlserver-data:
  rabbitmq-data:
