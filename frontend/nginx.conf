# SignalR hace el negotiate por HTTP normal y luego pide el upgrade a WebSocket:
# solo se reenvía "Connection: upgrade" cuando el cliente realmente lo pidió.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La barra final de proxy_pass quita el prefijo: /api/orders -> http://orders-api:8080/orders.
    # El prefijo existe para que la ruta de la SPA /orders no choque con el endpoint /orders.
    location /api/ {
        proxy_pass http://orders-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Igual que /api/: /inventory-api/products -> http://inventory-worker:8080/products.
    location /inventory-api/ {
        proxy_pass http://inventory-worker:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sin barra final: /hubs/orders llega igual a Orders API.
    location /hubs/ {
        proxy_pass http://orders-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # El WebSocket puede estar inactivo entre eventos; el keep-alive de SignalR (15 s) lo mantiene vivo.
        proxy_read_timeout 1h;
    }

    # Fallback de la SPA: cualquier ruta que no sea un archivo la resuelve react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
